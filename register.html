<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="/register" method="post" id="regForm">
      <label for="user">使用者名稱:</label>
      <input
        type="text"
        id="user"
        name="username"
        required
        minlength="4"
        maxlength="10"
        size="12"
        placeholder="4-10個字元"
      /><br />

      <!-- <label for="pwd">密碼:</label>
      <input
        type="password"
        id="pwd"
        name="password"
        required
        pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
        title="至少包含大小寫字母和數字，且長度至少8位"
      /><br /> -->

      <label for="age">年齡:</label>
      <input
        type="number"
        id="age"
        name="age"
        min="18"
        max="99"
        step="1"
      /><br />

      <label for="avatar">頭像:</label>
      <input
        type="file"
        id="avatar"
        name="avatar"
        accept="image/png, image/jpeg"
      /><br />

      <label>興趣:</label>
      <input type="checkbox" id="cb1" name="interests" value="coding" checked />
      <label for="cb1">寫程式</label>
      <input type="checkbox" id="cb2" name="interests" value="music" />
      <label for="cb2">聽音樂</label><br />

      <label>性別:</label>
      <input type="radio" id="male" name="gender" value="M" required />
      <label for="male">男</label>
      <input type="radio" id="female" name="gender" value="F" />
      <label for="female">女</label><br />

      <label for="color">我喜歡的顏色:</label>
      <input type="color" name="myFavoriteColor" id="color" />

      <input type="hidden" name="source" value="web" />

      <select name="IBornAt" id="bornPlace">
        <optgroup label="亞洲">
          <option value="tw">台灣</option>
          <option value="jp">日本</option>
        </optgroup>
        <optgroup label="歐洲">
          <option value="fr">法國</option>
        </optgroup>
      </select>
      <hr />

      <label for="browsers">我使用的瀏覽器:</label>
      <input list="browsers" name="usingBrowser" />
      <datalist id="browsers">
        <option value="Chrome"></option>
        <option value="Firefox"></option>
        <option value="Safari"></option></datalist
      ><br />

      <button type="button">檢查此帳號是否已註冊過</button>
      <button type="submit">註冊</button>
      <button type="reset">重設</button>
    </form>

    <!-- 外部輸入框，但屬於上述表單 -->
    <label for="promo">優惠碼:</label>
    <input type="text" id="promo" name="promo_code" form="regForm" />
  </body>
</html>
