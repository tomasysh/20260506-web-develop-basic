<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS playground</title>
    <script>
      //   alert("hello world");
      const age = 23;
      const titleDOM = document.getElementById("title"); // null
      if (age > 22) {
        console.log("大學畢業");
        titleDOM.innerHTML = "大學畢業"; // null.innerHTML -> type error null 沒有 innerHTML
      } else if (age > 65) {
        console.log("退休");
        titleDOM.innerHTML = "退休";
      } else {
        console.log("未成年");
        titleDOM.innerHTML = "未成年";
      }
    </script>
  </head>
  <body>
    <h1 id="title">這是 h1 標籤</h1>
  </body>
</html>
