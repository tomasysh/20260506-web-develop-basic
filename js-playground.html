      // for 迴圈應用題 - Array 加總
      const numbers = [1, 2, 3, 4, 5];
      console.log("numbers 長度: " + numbers.length);
      // 使用 index 索引來查詢陣列特定位置的值, index 起始值是 0
      console.log("numbers[0]: ", numbers[0]);
      console.log("numbers[1]: ", numbers[1]);
      console.log("numbers[2]: ", numbers[2]);
      console.log("numbers[3]: ", numbers[3]);
      console.log("numbers[4]: ", numbers[4]);

      console.log("=====迴圈應用題 - Array 列印 =====");
      for (i = 0; i < numbers.length; i++) {
        console.log("現在是第" + (i + 1) + "圈");
      }

      console.log("=====迴圈應用題 - Array 加總 =====");
      console.log("陣列的值是: " + numbers);
      let result = 0;
      for (i = 0; i < numbers.length; i++) {
        result = result + numbers[i];
        // 0: 0 = 0 + 1 (numbers[0])
        // 1: 1 = 1 + 2 (numbers[1])
        // 2: 3 = 3 + 3 (numbers[2])
        // 3: 6 = 6 + 4 (numbers[3])
        // 4: 10 = 10 + 5 (numbers[4])
        console.log("現在 index 是: " + i + "; 值是 " + numbers[i]);
        console.log("現在 result 是: ", result);
      }
      console.log("=========================");
      console.log("Array 加總的結果是: " + result);
