<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS playground</title>
  </head>
  <body>
    <h1 id="title">這是 h1 標籤</h1>
    <script>
      const users = [
        { name: "Andy", age: 40 },
        { name: "Zoe", age: 20 },
      ];
      // 取得姓名清單， map
      const nameList = users.map((user) => user.name);
      console.log("nameList==>", nameList);
      // 留下 age > 39 的人
      const oldUserList = users.filter((user) => user.age > 39);
      console.log("oldUserList==>", oldUserList);
    </script>
  </body>
</html>
